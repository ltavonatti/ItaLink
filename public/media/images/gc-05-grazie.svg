<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grazie-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow-gr" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" rx="24" fill="url(#grazie-bg)"/>
  
  <!-- Decorative background curves -->
  <circle cx="100" cy="90" r="130" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="700" cy="310" r="170" fill="#ffffff" fill-opacity="0.06"/>
  <path d="M0,320 Q250,260 500,310 T800,280 L800,400 L0,400 Z" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Glowing Heart Silhouette -->
  <g transform="translate(400, 160)" filter="url(#shadow-gr)">
    <circle cx="0" cy="0" r="70" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M0,-20 C-30,-55 -80,-15 -50,30 C-30,55 0,80 0,80 C0,80 30,55 50,30 C80,-15 30,-55 0,-20 Z" fill="url(#heart-grad)"/>
  </g>
  
  <!-- Italian Flag accent ribbon -->
  <g transform="translate(325, 305)">
    <rect x="0" y="0" width="50" height="10" rx="5" fill="#009246"/>
    <rect x="50" y="0" width="50" height="10" fill="#ffffff"/>
    <rect x="100" y="0" width="50" height="10" rx="5" fill="#ce2b37"/>
  </g>
</svg>
