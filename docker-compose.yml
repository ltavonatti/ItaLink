version: '3.8'

services:
  passo-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: passo-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production

