<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ciao-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" rx="24" fill="url(#ciao-bg)"/>
  
  <!-- Decorative background curves -->
  <circle cx="720" cy="80" r="140" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="80" cy="340" r="180" fill="#ffffff" fill-opacity="0.05"/>
  <path d="M0,280 Q200,220 400,270 T800,240 L800,400 L0,400 Z" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Warm Sun -->
  <circle cx="400" cy="170" r="75" fill="url(#sun-grad)" filter="url(#shadow)"/>
  
  <!-- Italian Flag colored ribbon accent -->
  <g transform="translate(325, 305)">
    <rect x="0" y="0" width="50" height="10" rx="5" fill="#009246"/>
    <rect x="50" y="0" width="50" height="10" fill="#ffffff"/>
    <rect x="100" y="0" width="50" height="10" rx="5" fill="#ce2b37"/>
  </g>

  <!-- Friendly Waving Hand Silhouette -->
  <g transform="translate(400, 160) scale(1.1)" filter="url(#shadow)">
    <path d="M-28,15 C-32,0 -25,-25 -10,-32 C-2,-35 8,-28 10,-15 C15,-28 28,-28 32,-15 C36,-26 48,-24 50,-10 C52,-20 62,-18 64,-6 C68,18 52,48 24,54 C-5,60 -24,42 -28,15 Z" fill="#ffffff" fill-opacity="0.95"/>
  </g>
</svg>
